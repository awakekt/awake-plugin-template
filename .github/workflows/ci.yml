name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, compile for web, and package
        run: ./gradlew :plugin:desktopTest :plugin:compileKotlinWasmJs :plugin:awakePlugin
      - name: Check the archive layout
        run: |
          archive=$(ls plugin/build/awakeplugin/*.awakeplugin)
          unzip -l "$archive"
          unzip -l "$archive" | grep -q ' plugin.json$'
          unzip -l "$archive" | grep -q ' lib/.*\.jar$'
      - uses: actions/upload-artifact@v4
        with:
          name: awakeplugin
          path: plugin/build/awakeplugin/*.awakeplugin
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" plugin/build/awakeplugin/*.awakeplugin --generate-notes
